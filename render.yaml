services:
  # 1. PostgreSQL Database
  - type: database
    name: skillsphere-db
    databaseName: skillsphere
    user: skillsphere_user
    plan: free

  # 2. Redis for caching (Optional but recommended)
  - type: redis
    name: skillsphere-redis
    plan: free
    ipAllowList: [] # Allow internal traffic

  # 3. Backend (FastAPI)
  - type: web
    name: skillsphere-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillsphere-db
          property: connectionString
      - key: REDIS_URL
        fromRedis:
          name: skillsphere-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*" # Initially allow all, update this to your frontend URL later for security

  # 4. Frontend (Next.js)
  - type: web
    name: skillsphere-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: skillsphere-backend
          property: host
