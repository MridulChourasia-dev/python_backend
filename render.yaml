databases:
  - name: skillsphere-db
    plan: free

services:
  - type: keyvalue
    name: skillsphere-redis
    plan: free
    ipAllowList: [] # Required to allow access from other services

  - type: web
    name: skillsphere-backend
    env: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: skillsphere-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: skillsphere-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: skillsphere-frontend
    env: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: skillsphere-backend
          property: host
